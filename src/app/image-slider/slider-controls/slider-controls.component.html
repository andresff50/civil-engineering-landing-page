<div class="slider-controls">
  <button
    type="button"
    title="btn-prev"
    class="slide-button prev"
    (click)="onPrevious()">
    <i class="fa-solid fa-chevron-left"></i>
  </button>

  <button
    type="button"
    title="btn-next"
    class="slide-button next"
    (click)="onNext()">
    <i class="fa-solid fa-angle-right"></i>
  </button>
</div>

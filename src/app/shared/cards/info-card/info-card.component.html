<div class="card-container">
  <div class="card-header">{{ headerTitle() }}</div>
  <div class="card-body">
    <h2>{{ title() }}</h2>
    <p>{{ description() }}</p>
    <div class="card-buttons">
      <div class="first-btn">
        <app-primary-button
          [icon]="firstBtnIcon()"
          [iconPosition]="firstBtnIconPosition()"
          [text]="firstBtnText()">
        </app-primary-button>
      </div>
      <div class="second-btn">
        <app-primary-button
          [icon]="secondBtnIcon()"
          [iconPosition]="secondBtnIconPosition()"
          [text]="secondBtnText()">
        </app-primary-button>
      </div>
    </div>
  </div>
</div>
